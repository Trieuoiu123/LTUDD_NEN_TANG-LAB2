<!DOCTYPE html>
<html>
<head><title>Icon Generator</title></head>
<body>
<script>
/**
 * Generate PWA icons as PNG files from canvas.
 * Open this file in browser, icons will auto-download.
 */
const sizes = [72, 96, 128, 144, 152, 192, 384, 512];

sizes.forEach(size => {
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');

  // Background gradient
  const grad = ctx.createLinearGradient(0, 0, size, size);
  grad.addColorStop(0, '#7c5cfc');
  grad.addColorStop(0.5, '#a78bfa');
  grad.addColorStop(1, '#f472b6');

  // Rounded rect background
  const r = size * 0.18;
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(size - r, 0);
  ctx.quadraticCurveTo(size, 0, size, r);
  ctx.lineTo(size, size - r);
  ctx.quadraticCurveTo(size, size, size - r, size);
  ctx.lineTo(r, size);
  ctx.quadraticCurveTo(0, size, 0, size - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // Letter "P"
  ctx.fillStyle = '#ffffff';
  ctx.font = `bold ${size * 0.55}px 'Arial', sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('P', size / 2, size / 2 + size * 0.02);

  // Download
  const link = document.createElement('a');
  link.download = `icon-${size}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
});

document.body.innerHTML = '<h1 style="font-family:sans-serif;text-align:center;margin-top:100px">✅ Icons generated! Check your Downloads folder.<br>Move them to <code>assets/icons/</code></h1>';
</script>
</body>
</html>
